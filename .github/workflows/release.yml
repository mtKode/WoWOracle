# Builds the WoW Oracle zip on GitHub's Windows machines and puts it on a Release.
#
#   Release:   commit and push your changes, then
#                git tag v1.0.1
#                git push origin v1.0.1
#              → a Release "WoW Oracle v1.0.1" appears with WoWOracle-1.0.1.zip attached. The tag sets the
#                version (the app's About line, the zip name); Directory.Build.props is only for local builds.
#   Test build: Actions tab → "Release" → Run workflow. The zip is attached to the run (no Release).
#
# The font is never included here (licensed); publish.ps1 -IncludeFont is for private copies only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the zip
        shell: pwsh
        run: |
          # A tag like v1.2.0 is the version (app, zip and Release); a manual run uses Directory.Build.props.
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "" }
          .\publish.ps1 -Version $version

      - name: Keep the zip with the run
        uses: actions/upload-artifact@v4
        with:
          name: WoWOracle
          path: dist/*.zip

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WoW Oracle ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
