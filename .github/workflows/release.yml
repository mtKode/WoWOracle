# Builds the WoW Oracle zip on GitHub's Windows machines and puts it on a Release.
#
#   Release:   bump <Version> in Directory.Build.props, commit, then
#                git tag v1.0.1
#                git push origin v1.0.1
#              → a Release "WoW Oracle 1.0.1" appears with WoWOracle-1.0.1.zip attached.
#   Test build: Actions tab → "Release" → Run workflow. The zip is attached to the run (no Release).
#
# The font is never included here (licensed); publish.ps1 -IncludeFont is for private copies only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content .\Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match <Version>$version</Version> in Directory.Build.props"
          }

      - name: Build the zip
        shell: pwsh
        run: .\publish.ps1

      - name: Keep the zip with the run
        uses: actions/upload-artifact@v4
        with:
          name: WoWOracle
          path: dist/*.zip

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: WoW Oracle ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
